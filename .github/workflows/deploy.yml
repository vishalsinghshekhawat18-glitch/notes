name: Deploy Reading Hub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma, Seed SQLite & Build Next.js Static Export
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx scripts/seed-all.ts
          npx next build
          touch out/.nojekyll
        env:
          GITHUB_ACTIONS: "true"
          DATABASE_URL: "file:./dev.db"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
